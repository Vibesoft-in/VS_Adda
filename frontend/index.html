<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VS Adda — every social account, one calm workspace</title>
    <meta name="description" content="VS Adda is a social media management suite for teams and agencies: plan, write and schedule posts to Instagram, Facebook, X, LinkedIn, TikTok, YouTube, Pinterest and Threads; approve them; answer every comment and message in one inbox; read analytics; listen for your brand — with roles and permissions." />
    <meta name="theme-color" content="#f1f2ef" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Urbanist:wght@400..700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="mesh" aria-hidden="true">
      <i class="mesh__a"></i>
      <i class="mesh__b"></i>
      <i class="mesh__c"></i>
      <i class="mesh__d"></i>
      <i class="mesh__e"></i>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
